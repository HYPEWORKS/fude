[workspace]
resolver = "3"
members = ["crates/*", "fude", "xtask"]
exclude = ["fuzz"]
default-members = ["fude"]

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/HYPEWORKS/fude"

[workspace.dependencies]
fude-buffer = { path = "crates/fude-buffer" }
fude-editor = { path = "crates/fude-editor" }
fude-render = { path = "crates/fude-render" }
fude-syntax = { path = "crates/fude-syntax" }
fude-text = { path = "crates/fude-text" }
fude-tools = { path = "crates/fude-tools" }
fude-platform = { path = "crates/fude-platform" }
fude-ui = { path = "crates/fude-ui" }

winit = "0.30.13"
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
swash = "0.2.10"
harfrust = "0.15.0"
rustc-hash = "2"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal", "wayland"] }
# The macOS menu bar (only built there).
muda = { version = "0.21.2", default-features = false }
fontique = { version = "0.12.0", features = ["fontconfig-dlopen"] }
encoding_rs = "0.8.44"
chardetng = "1.0.0"
memchr = "2.8.3"
unicode-segmentation = "1.13.3"
regex-cursor = { version = "0.1.5", default-features = false, features = ["perf-inline"] }
regex-syntax = "0.8.11"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }

# Tests only.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind" # events and drawing run under catch_unwind (fude/README.md, "Fault isolation")

# Keep debug builds usable: rasterization and shaping are slow unoptimized.
[profile.dev.package."*"]
opt-level = 2
