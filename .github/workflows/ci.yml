name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p fude
      - name: Render benchmark (no window needed)
        shell: bash
        run: |
          ./target/release/fude --bench-render --size 1920x1080
          ./target/release/fude --bench-render --size 3840x2160 --scale 2
          ./target/release/fude --bench-typing --size 1920x1080
          ./target/release/fude --screenshot screenshot-${{ matrix.os }}.png --size 2200x1440 --scale 2
      # Opens each file of the (small) large-file corpus without a window: first screen,
      # loading, memory, and keystrokes in long lines and big files. Budgets are checked on
      # Linux; elsewhere (where finding a CJK fallback font the first time can take a while)
      # it's report-only for now.
      - name: Large-file benchmark
        shell: bash
        run: cargo xtask bench-large --small --no-build ${{ matrix.os == 'ubuntu-latest' && '--check' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: screenshot-${{ matrix.os }}
          path: screenshot-*.png

  startup:
    name: window (Linux, X11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install X server and runtime libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcursor1 libx11-xcb1
      # Report-only until we have a baseline for runner noise; then add --check.
      # -noreset: by default Xvfb resets whenever its last client exits, which would add
      # ~30 ms to every launch after the first.
      - name: Measure startup
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -noreset" cargo xtask bench-startup --runs 20
      # Types, clicks, copies, pastes and saves through the real window, then checks the file.
      - name: UI test
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -noreset" cargo xtask ui-test --no-build

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            . "$HOME/.cargo/env"
            cargo build --workspace --locked
            cargo test --workspace --locked

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: curl -fsSL https://github.com/rust-fuzz/cargo-fuzz/releases/download/0.13.2/cargo-fuzz-0.13.2-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.cargo/bin
      # A short run per target catches regressions; long runs happen locally.
      # --target: the prebuilt cargo-fuzz is a musl binary and would default to musl.
      - name: Fuzz
        working-directory: fuzz
        env:
          RUSTFLAGS: ""
        run: |
          for target in rope_edits decode history; do
            cargo fuzz run -O --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=45
          done
