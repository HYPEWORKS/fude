[package]
name = "xtask"
description = "Development tasks: benchmarks, UI tests and screenshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Writing the corpus's Shift_JIS file.
encoding_rs.workspace = true

# `cargo xtask ui-test` drives the app through X11 (XTest), on Linux and the BSDs.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13.2", features = ["xtest"] }

[lints]
workspace = true
