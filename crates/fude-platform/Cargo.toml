[package]
name = "fude-platform"
description = "Windowing, input and OS integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fude-render.workspace = true
winit.workspace = true
softbuffer.workspace = true
arboard.workspace = true
rfd.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true

# Drag and drop on Wayland, which winit doesn't do: shares winit's connection.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", default-features = false, features = ["client_system", "dlopen"] }

# The native menu bar.
[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

[lints]
workspace = true
